<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - National University</title>
    <link rel="stylesheet" href="../forgot_pass/forgot.css">

    <!-- Font Awesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Fonts for Clean Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="brand-header">
            <div class="logo-badge">
                <img src="../assets/NU_shield.svg" alt="Logo">
            </div>
                <div class="brand-text">
                    <h1>NATIONAL UNIVERSITY</h1>
                    <span>FAIRVIEW</span>
                </div>
            </div>
    
    <div class="bg-slider">
        <div class="slide slide-1"></div>
        <div class="slide slide-2"></div>
        <div class="slide slide-3"></div>
        <div class="slide slide-4"></div>
    </div>

    <div class="overlay"></div>
    
    <div class="container">
    <h2>Forgot your password?</h2>
    <text class="pword-desc">Enter the email used for your account
        and we'll send you a link to reset your password.
    </text>


    <form class="register-form">
        
        <!-- Student Email Input -->
        <div class="form-group">
            <label for="student-email">Email</label>
            <div class="input-wrapper">
              <i class="fa fa-envelope input-icon"></i>
              <input type="email" id="student-email" placeholder="Enter your email" required>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-button">RESET PASSWORD</button>
        <div class="return-link">
            <a href="../login page/login.html">RETURN TO LOGIN</a></span>
        </div>
        </form>
    </div>
<script src="login.js"></script>

</body>
</html>
